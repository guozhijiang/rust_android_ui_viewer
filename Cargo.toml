[package]
name = "android-ui-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.27", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.27"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
quick-xml = "0.36"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rfd = "0.14"
libloading = "0.8"
log = "0.4"
# Minimal pure-HTTP client for the on-device u2 JSON-RPC (localhost only; no TLS).
minreq = { version = "2", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
