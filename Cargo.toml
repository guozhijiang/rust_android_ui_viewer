[package]
name = "android-ui-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.27", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.27"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
quick-xml = "0.36"
anyhow = "1"
rfd = "0.14"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
